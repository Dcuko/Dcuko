<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090514"/>
      <stop offset="0.7" stop-color="#1d0e3d"/>
      <stop offset="1" stop-color="#2a1259"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#9146ff"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#e07bff"/>
    </linearGradient>
    <mask id="slices">
      <rect x="0" y="0" width="900" height="215" fill="#fff"/>
      <rect x="0" y="160" width="900" height="3" fill="#000"/>
      <rect x="0" y="175" width="900" height="4" fill="#000"/>
      <rect x="0" y="189" width="900" height="6" fill="#000"/>
      <rect x="0" y="203" width="900" height="8" fill="#000"/>
    </mask>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9146ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9146ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="22" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="50" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="28" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="70" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="36" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="110" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sol -->
  <g mask="url(#slices)" filter="url(#glow)">
    <circle cx="710" cy="165" r="92" fill="url(#sun)">
      <animate attributeName="r" values="90;95;90" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- horizonte e grid -->
  <rect x="0" y="215" width="900" height="85" fill="#12072a"/>
  <line x1="0" y1="215" x2="900" y2="215" stroke="#e07bff" stroke-width="2" filter="url(#glow)"/>
  <g stroke="url(#fade)" stroke-width="1">
    <line x1="450" y1="215" x2="-250" y2="300"/>
    <line x1="450" y1="215" x2="-90" y2="300"/>
    <line x1="450" y1="215" x2="70" y2="300"/>
    <line x1="450" y1="215" x2="230" y2="300"/>
    <line x1="450" y1="215" x2="390" y2="300"/>
    <line x1="450" y1="215" x2="510" y2="300"/>
    <line x1="450" y1="215" x2="670" y2="300"/>
    <line x1="450" y1="215" x2="830" y2="300"/>
    <line x1="450" y1="215" x2="990" y2="300"/>
    <line x1="450" y1="215" x2="1150" y2="300"/>
  </g>
  <g stroke="#9146ff" stroke-opacity="0.55" stroke-width="1">
    <line x1="0" y1="226" x2="900" y2="226"/>
    <line x1="0" y1="241" x2="900" y2="241"/>
    <line x1="0" y1="260" x2="900" y2="260"/>
    <line x1="0" y1="284" x2="900" y2="284"/>
  </g>

  <!-- texto -->
  <text x="48" y="78" font-size="17" fill="#7df9ff">
    &gt; hello, world
    <tspan fill="#7df9ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_
    </tspan>
  </text>
  <text x="46" y="142" font-size="58" font-weight="800" fill="url(#txt)" filter="url(#glow)" letter-spacing="1">
    AUGUSTO
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="48" y="182" font-size="18" fill="#cdb8ff">
    aka <tspan fill="#ff7ab8" font-weight="700">Dcuko</tspan>  //  dev em construção
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
